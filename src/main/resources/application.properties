spring.application.name=ApiGatewaySept28

server.port=7070
server.address=0.0.0.0

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#API endpoint -> corresponding MS

spring.cloud.gateway.server.webflux.routes[0].id=productservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**
#^Sspring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[0].uri=lb://productserviceoct7

spring.cloud.gateway.server.webflux.routes[1].id=userservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**
#spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=0
spring.cloud.gateway.server.webflux.routes[1].uri=lb://userserviceoct3
